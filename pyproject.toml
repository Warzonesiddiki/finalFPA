[project]
name = "fpa-monthend-copilot"
version = "0.1.0"
description = "FP&A Month-End Copilot - Deterministic financial analysis and reporting assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "duckdb>=1.1.0",
    "polars>=1.9.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.0",
    "httpx>=0.27.0",
    "jsonschema>=4.23.0",
    "pywebview>=5.1.0",
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pyinstaller>=6.10.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "import-linter>=2.0.0",
    "types-openpyxl>=3.1.5",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Perf/scale tests are EXCLUDED from the default run. They are slow by design
# (250k-row rule runs and import benchmarks, minutes each) and would dominate the
# inner dev loop; doc 14 section 13.1 runs them as a separate gate step.
#
# This means a bare `pytest` is the FAST suite. The performance gate is explicit:
#     pytest -m perf
# and `scripts/check` runs both in sequence.
addopts = "-ra -q --strict-markers -m 'not perf'"
markers = [
    "perf: Performance and scale benchmark tests",
    "unit: Fast isolated unit tests",
    "integration: Integration and multi-component tests",
    "tst: Mechanically binds test cases back to doc-20 traceability table IDs (doc 14 line 135)",
    "tst_id: Mechanically binds test cases back to doc-14 test catalogue identifiers (DEF-012)",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["tests/*", "app/cli/*"]

[tool.coverage.report]
show_missing = true
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# TB-014: headless-engine boundary (docs/09 §4.1, docs/17 §3).
# app/engine/** may not import fastapi, pywebview, app.api, app.desktop or
# app.jobs. Enforced by `lint-imports`, run from scripts/check.py.
# TB-015: shared ruff config (docs/17 §3.1). Line length 100; absolute
# imports within app.*; no wildcards; stdlib → third-party → local grouping.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901", "T201", "PLR0913"]
ignore = ["E501"]

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.per-file-ignores]
# scripts/ and tests/ legitimately print and take many fixture args.
"scripts/*" = ["T201", "PLR0913"]
"tests/*" = ["T201", "PLR0913"]
"app/api/*" = ["T201"]
"app/cli/*" = ["T201"]

# TB-016: mypy config (docs/17 §3.1). --strict on app/engine, standard
# mypy on the rest of app/; no `# type: ignore` without a reason comment.
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "app.engine.*"
strict = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "headless-engine boundary (09 S4.1)"
type = "forbidden"
source_modules = ["app.engine"]
forbidden_modules = ["fastapi", "pywebview", "app.api", "app.desktop", "app.jobs"]
